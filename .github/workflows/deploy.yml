name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential wget zip

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Install vcpkg dependencies
        run: |
          ./vcpkg/vcpkg install --triplet x64-linux rtaudio qt6-base qt6-declarative qt6-quickcontrols2

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Linux artifact
        run: |
          cmake --install build --config Release --prefix package
          curl -L -o linuxdeployqt.AppImage https://github.com/linuxdeploy/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt.AppImage
          ./linuxdeployqt.AppImage package/usr/bin/MyPedalboard -appimage
          mkdir -p artifact
          mv MyPedalboard*.AppImage artifact/
          zip -j artifact/mypedalboard-linux.zip artifact/*.AppImage

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: MyPedalboard-linux
          path: artifact/mypedalboard-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: |
          .\vcpkg\vcpkg.exe install --triplet x64-windows rtaudio qt6-base qt6-declarative qt6-quickcontrols2

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -A x64 \
            -DCMAKE_TOOLCHAIN_FILE=%CD%\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows artifact
        run: |
          cmake --install build --config Release --prefix package
          .\vcpkg\installed\x64-windows\tools\qt6\bin\windeployqt.exe package\\MyPedalboard.exe
          powershell -Command "Compress-Archive -Path package\\* -DestinationPath mypedalboard-windows.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MyPedalboard-windows
          path: mypedalboard-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Install vcpkg dependencies
        run: |
          ./vcpkg/vcpkg install --triplet x64-osx rtaudio qt6-base qt6-declarative qt6-quickcontrols2

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package macOS artifact
        run: |
          cmake --install build --config Release --prefix package
          "${{ github.workspace }}/vcpkg/installed/x64-osx/tools/qt6/bin/macdeployqt" package/MyPedalboard.app
          ditto -c -k --rsrc --keepParent package/MyPedalboard.app mypedalboard-macos.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: MyPedalboard-macos
          path: mypedalboard-macos.zip
